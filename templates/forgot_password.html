<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='forgot_password.css') }}">

</head>

<body>

<div class="background"></div>

<div class="container">

    <div class="card">

        <div class="icon">🔒</div>

        <h2>Forgot Password?</h2>

        <p>
            Enter your registered email address to reset your password.
        </p>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('forgot_password') }}" method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required>

            <button type="submit">
                Continue
            </button>

        </form>

        <a href="{{ url_for('home') }}">
            ← Back to Login
        </a>

    </div>

</div>

</body>

</html>
